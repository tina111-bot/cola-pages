<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞宫小奇门在线排盘</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "KaiTi","STKaiti","SimSun",serif;
    background:#f5f0e6;
    color:#2b2b2b;
    padding:16px 12px 40px;
    -webkit-text-size-adjust:100%;
  }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { text-align:center; font-size:26px; letter-spacing:6px; margin-bottom:6px; color:#333; }
  .sub { text-align:center; font-size:13px; color:#777; margin-bottom:16px; }
  .panel {
    background:#fffdf7;
    border:1px solid #c9b98a;
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:14px;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .panel-title { font-size:15px; color:#8a2f2f; letter-spacing:2px; margin-bottom:10px; text-align:center; }
  /* 公历输入 */
  .gongli-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; }
  .gongli-row select, .gongli-row input {
    font-family:inherit; font-size:16px; padding:4px 4px; border:1px solid #b8a86e;
    border-radius:4px; background:#fff; text-align:center;
  }
  .gongli-row .unit { font-size:13px; color:#8a7a4a; }
  .btn-row { text-align:center; margin-top:12px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  button {
    font-family:inherit; font-size:16px; padding:8px 22px; border:none; border-radius:6px;
    background:#8a2f2f; color:#fff; cursor:pointer; letter-spacing:2px;
  }
  button:hover { background:#a53a3a; }
  button:active { transform:translateY(1px); }
  button.ghost { background:#fff; color:#8a2f2f; border:1px solid #8a2f2f; }
  button.ghost:hover { background:#f7ecec; }
  button.mini { font-size:13px; padding:5px 12px; letter-spacing:1px; }
  .hint { font-size:12px; color:#999; text-align:center; margin-top:10px; line-height:1.7; }
  /* 换算结果预览 */
  .result-box {
    margin-top:12px; border:1px solid #d8c9a0; border-radius:6px; background:#fbf6e8;
    padding:10px 12px; text-align:center;
  }
  .result-box .rl { font-size:12px; color:#8a7a4a; letter-spacing:2px; margin-bottom:4px; }
  .result-box .rp { font-size:22px; letter-spacing:3px; color:#8a2f2f; }
  .result-box .rm { font-size:12px; color:#777; margin-top:5px; line-height:1.6; }
  .result-box.empty .rp { color:#bbb; font-size:16px; letter-spacing:1px; }
  /* 四柱手选 */
  .pillar-row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:flex-end; }
  .pillar { text-align:center; }
  .pillar .lbl { font-size:13px; color:#8a7a4a; margin-bottom:4px; }
  .pillar select {
    font-family:inherit; font-size:17px; padding:4px 6px; border:1px solid #b8a86e;
    border-radius:4px; background:#fff; width:58px; text-align:center;
  }
  .pillar select.stem { width:54px; }
  .pillar-row.flash .pillar select { animation:flash .9s ease; }
  @keyframes flash {
    0% { background:#ffe9a8; border-color:#8a2f2f; }
    100% { background:#fff; border-color:#b8a86e; }
  }
  .badge {
    text-align:center; font-size:12px; margin-top:8px; min-height:16px; color:#2e7d32;
  }
  .badge.warn { color:#b26a00; }
  .shi-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; margin-top:12px; }
  .shi-row .lbl { font-size:13px; color:#8a7a4a; }
  button.shi-btn {
    font-size:14px; padding:5px 10px; border:1px solid #b8a86e; border-radius:4px;
    background:#fff; color:#333; cursor:pointer; letter-spacing:1px;
  }
  button.shi-btn:hover { background:#f7f0dd; border-color:#8a2f2f; color:#8a2f2f; }
  button.shi-btn.active { background:#8a2f2f; color:#fff; border-color:#8a2f2f; }
  .info { margin:10px 0 4px; font-size:14px; color:#555; text-align:center; line-height:1.8; }
  .info b { color:#8a2f2f; }
  /* 预测事项 */
  .predict { margin-top:12px; border:1px dashed #c9b98a; border-radius:8px; padding:12px 14px; background:#fffdf7; }
  .predict .p-title { font-size:14px; color:#8a2f2f; letter-spacing:2px; margin-bottom:8px; text-align:center; }
  .predict textarea {
    width:100%; min-height:60px; font-family:inherit; font-size:14px; line-height:1.7;
    border:1px solid #c9b98a; border-radius:6px; padding:8px; background:#fff; resize:vertical;
  }
  .predict .p-row { display:flex; justify-content:center; align-items:center; gap:10px; margin-top:8px; }
  .predict .p-status { font-size:12px; color:#999; }
  /* 盘面 */
  #chartArea { margin-top:10px; }
  #chartHead { text-align:center; font-size:16px; letter-spacing:2px; margin-bottom:10px; color:#333; }
  #chartHead .pillars { font-size:18px; margin-bottom:4px; }
  #chartHead .meta { font-size:13px; color:#666; }
  .grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,auto);
    border:2px solid #333;
    background:#333;
    gap:2px;
    max-width:640px;
    margin:0 auto;
  }
  .cell {
    background:#fffdf7;
    min-height:196px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:8px;
    position:relative;
  }
  .cell .gong { position:absolute; top:4px; left:6px; font-size:13px; color:#8a7a4a; }
  .cell .txt { font-size:19px; line-height:1.7; letter-spacing:2px; text-align:center; }
  .cell .txt .pair { display:block; }
  .cell .txt .men { display:block; margin-top:4px; }
  .cell .txt .gan { display:block; margin-top:4px; font-size:22px; }
  .cell .txt .ys { color:#1565c0; }
  .cell .txt .ys2 { color:#2b2b2b; }
  .cell .txt .jx { color:#2e9e44; }
  .cell .txt .jx2 { color:#2b2b2b; }
  .cell .txt .men { color:#9c27b0; }
  .cell.center { background:#fbf6e8; }
  .cell.center .gan { font-size:26px; letter-spacing:8px; }
  .note { font-size:12px; color:#999; text-align:center; margin-top:10px; }
  .legend {
    max-width:640px; margin:14px auto 0; font-size:13px; color:#666; line-height:1.9;
    border-top:1px dashed #c9b98a; padding-top:10px;
  }
  /* 历史 */
  .h-item { border:1px solid #e3d9b8; border-radius:6px; padding:8px 12px; margin-bottom:8px; background:#fff; display:flex; gap:8px; align-items:flex-start; }
  .h-body { flex:1; cursor:pointer; }
  .h-item:hover { border-color:#8a2f2f; background:#fdf8ef; }
  .h-pillars { font-size:14px; color:#8a2f2f; }
  .h-text { font-size:13px; color:#333; margin-top:3px; }
  .h-time { font-size:12px; color:#999; margin-top:3px; }
  .h-del {
    background:none; border:none; color:#bbb; font-size:20px; line-height:1;
    padding:2px 6px; cursor:pointer; letter-spacing:0;
  }
  .h-del:hover { color:#c62828; background:none; }
  /* 手机 */
  @media (max-width:560px){
    body { padding:12px 8px 32px; }
    h1 { font-size:22px; letter-spacing:4px; }
    .panel { padding:12px 10px; }
    .gongli-row select { font-size:15px; padding:4px 2px; }
    .pillar select { width:48px; font-size:16px; padding:4px 2px; }
    .pillar select.stem { width:46px; }
    .result-box .rp { font-size:18px; letter-spacing:1px; }
    .cell { min-height:132px; padding:5px 2px; }
    .cell .txt { font-size:14px; letter-spacing:0; line-height:1.5; }
    .cell .txt .gan { font-size:16px; margin-top:2px; }
    .cell.center .gan { font-size:18px; letter-spacing:3px; }
    .cell .gong { font-size:11px; }
    button { font-size:15px; padding:8px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>飞宫小奇门</h1>
  <div class="sub">在线排盘 · 张冠武传 / 霍斐然整理体系</div>

  <div class="panel">
    <div class="panel-title">一、公历时间 → 四柱</div>
    <div class="gongli-row">
      <select id="gYear"></select><span class="unit">年</span>
      <select id="gMonth"></select><span class="unit">月</span>
      <select id="gDay"></select><span class="unit">日</span>
      <select id="gHour"></select><span class="unit">时</span>
      <select id="gMin"></select><span class="unit">分</span>
    </div>
    <div class="btn-row">
      <button onclick="convertFromGongli()">换算并起局</button>
      <button class="ghost mini" onclick="fillNow()">填此刻</button>
    </div>
    <div class="result-box empty" id="resultBox">
      <div class="rl">换 算 结 果</div>
      <div class="rp" id="resultPillars">— 未换算 —</div>
      <div class="rm" id="resultMeta">选好公历时间后点「换算并起局」，结果会自动填入下方四柱</div>
    </div>
    <div class="hint">按北京时间（东八区）。年柱以立春分界、月柱以十二节分界（精确到分钟）；23:00 后按晚子时，日柱进次日。</div>
  </div>

  <div class="panel">
    <div class="panel-title">二、四柱（可手选微调）</div>
    <div class="pillar-row" id="pillarRow">
      <div class="pillar"><div class="lbl">年</div><select class="stem" id="yGan"></select><select id="yZhi"></select></div>
      <div class="pillar"><div class="lbl">月</div><select class="stem" id="mGan"></select><select id="mZhi"></select></div>
      <div class="pillar"><div class="lbl">日</div><select class="stem" id="dGan"></select><select id="dZhi"></select></div>
      <div class="pillar"><div class="lbl">时</div><select class="stem" id="tGan"></select><select id="tZhi"></select></div>
    </div>
    <div class="badge" id="syncBadge"></div>
    <div class="btn-row">
      <button onclick="paipan(true)">起 局</button>
      <button class="ghost" onclick="savePng()">存为图片</button>
    </div>
    <div class="shi-row"><span class="lbl">按时辰直接调局：</span></div>
    <div class="shi-row" id="shiBtns"></div>
  </div>

  <div class="predict panel">
    <div class="p-title">预测事项（随四柱保存）</div>
    <textarea id="predictText" placeholder="记录本次要预测的事项，例如：台风什么时候走？／这事能不能成？"></textarea>
    <div class="p-row">
      <button class="mini" onclick="savePredict()">保存事项</button>
      <span class="p-status" id="predictStatus"></span>
    </div>
  </div>

  <div class="info" id="info"></div>

  <div id="chartArea" style="display:none;">
    <div id="chartHead"></div>
    <div class="grid" id="grid"></div>
    <div class="note">※ 盘面仅供术数学习与案例分析，涉及健康、法律、投资等现实决定请以专业意见为准。</div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="panel-title">三、历史记录（一事一盘）</div>
    <div id="historyList"></div>
    <div class="hint">点击记录可载入该盘；记录保存在本机浏览器。</div>
  </div>
</div>

<script>
// ========== 基础数据 ==========
var GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var YUANSHEN = ['青龙','明堂','天刑','朱雀','金匮','天德','白虎','玉堂','天牢','玄武','司命','勾陈'];
var JIANXING = ['建','除','满','平','定','执','破','危','成','收','开','闭'];
var MEN = ['休','生','伤','杜','景','死','惊','开'];

var zhiGong = {子:1,丑:8,寅:8,卯:3,辰:4,巳:4,午:9,未:2,申:2,酉:7,戌:6,亥:6};
var gongName = {1:'坎',2:'坤',3:'震',4:'巽',5:'中',6:'乾',7:'兑',8:'艮',9:'离'};
var heGan = {甲:'己',乙:'庚',丙:'辛',丁:'壬',戊:'癸',己:'甲',庚:'乙',辛:'丙',壬:'丁',癸:'戊'};
// 中宫合化对：按青龙宫固定（十二局盘，不随月干变）
// 坎1/乾6→戊癸，艮8/震3→丙辛，巽4/离9→乙庚，坤2/兑7→丁壬（洛书数差5成对）
// 中宫两干按既定口径整体颠序：戊癸→癸戊，丙辛→辛丙，乙庚→庚乙，丁壬→壬丁
function zhongGanForGong(g){
  if(g===1||g===6) return ['癸','戊'];
  if(g===8||g===3) return ['辛','丙'];
  if(g===4||g===9) return ['庚','乙'];
  return ['壬','丁']; // 2,7
}
var jianKouJue = {子:'申',午:'申',卯:'寅',酉:'寅',寅:'子',申:'子',巳:'午',亥:'午',丑:'戌',未:'戌',辰:'辰',戌:'辰'};
var baguaOrder = [1,8,3,4,9,2,7,6];
var gongZhi = {1:['子'],8:['丑','寅'],3:['卯'],4:['辰','巳'],9:['午'],2:['未','申'],7:['酉'],6:['戌','亥']};
var gridLayout = [[4,9,2],[3,5,7],[8,1,6]];

// ========== 公历 → 四柱（万年历） ==========
function julianDay(y,m,d){
  if(m<=2){ y-=1; m+=12; }
  var A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunLon(jd){
  var T=(jd-2451545.0)/36525.0;
  var L0=280.46646+36000.76983*T+0.0003032*T*T;
  var M=357.52911+35999.05029*T-0.0001537*T*T;
  var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M*Math.PI/180)
       +(0.019993-0.000101*T)*Math.sin(2*M*Math.PI/180)
       +0.000289*Math.sin(3*M*Math.PI/180);
  return ((L0+C)%360+360)%360;
}
function findJieQi(year,targetLon){
  // 按节气所在公历月份锁定窄搜索窗口（窗口内太阳黄经单调，只含目标一次，无需绕圈取模）
  var R = {315:[1,20,3,5],345:[2,20,4,5],15:[3,20,5,5],45:[4,20,6,5],75:[5,20,7,5],
           105:[6,20,8,5],135:[7,20,9,5],165:[8,20,10,5],195:[9,20,11,5],225:[10,20,12,5],
           255:[11,20,1,5],285:[12,20,2,5]};
  var r=R[targetLon];
  var lo, hi;
  if(r[0]>r[2]){ lo=julianDay(year,r[0],r[1]); hi=julianDay(year+1,r[2],r[3]); }
  else { lo=julianDay(year,r[0],r[1]); hi=julianDay(year,r[2],r[3]); }
  for(var i=0;i<60;i++){
    var mid=(lo+hi)/2, lon=sunLon(mid);
    if(lon>targetLon) hi=mid; else lo=mid;
  }
  return (lo+hi)/2;
}
// 月支分界的12个节（黄经）
var JIE_LON = {立春:315,惊蛰:345,清明:15,立夏:45,芒种:75,小暑:105,立秋:135,白露:165,寒露:195,立冬:225,大雪:255,小寒:285};
var JIE_SEQ = [['立春','寅'],['惊蛰','卯'],['清明','辰'],['立夏','巳'],['芒种','午'],['小暑','未'],['立秋','申'],['白露','酉'],['寒露','戌'],['立冬','亥'],['大雪','子'],['小寒','丑']];

function jdToBJ(jd){
  var ms=(jd-2440587.5)*86400000 + 8*3600000;
  var dt=new Date(ms);
  return (dt.getUTCMonth()+1)+'月'+dt.getUTCDate()+'日 '+
    ('0'+dt.getUTCHours()).slice(-2)+':'+('0'+dt.getUTCMinutes()).slice(-2);
}

// 返回 {p:[年柱,月柱,日柱,时柱], jie:本月所行之节, jieAt:该节北京时间}
function pillarsFromGongli(y,mo,d,hh,mm){
  // 北京时间 → UT 儒略日
  var jd=julianDay(y,mo,d)+((hh+mm/60-8)/24);
  // 日柱（23点后算次日）
  var jdDay = hh>=23 ? julianDay(y,mo,d)+1 : julianDay(y,mo,d);
  var diff = Math.round(jdDay - julianDay(2000,1,7));
  var dayIdx=((diff%60)+60)%60;
  var dg=GAN[dayIdx%10], dz=ZHI[dayIdx%12];
  // 年柱（立春分界）
  var lc=findJieQi(y,315);
  var yg,yz;
  if(jd<lc){ var i1=(((y-1-4)%60)+60)%60; yg=GAN[i1%10]; yz=ZHI[i1%12]; }
  else { var i2=(((y-4)%60)+60)%60; yg=GAN[i2%10]; yz=ZHI[i2%12]; }
  // 月柱（节气分界）：从上年大雪起排，保证 1 月初（小寒前）仍归子月
  var marks=[findJieQi(y-1,255), findJieQi(y-1,285)];
  var names=[['大雪','子'],['小寒','丑']];
  for(var k=0;k<JIE_SEQ.length;k++){
    marks.push(findJieQi(y,JIE_LON[JIE_SEQ[k][0]]));
    names.push([JIE_SEQ[k][0],JIE_SEQ[k][1]]);
  }
  var mi=0;
  for(var j=0;j<marks.length;j++){ if(jd>=marks[j]) mi=j; else break; }
  var mz=names[mi][1], jieName=names[mi][0], jieAt=marks[mi];
  var mg=GAN[(GAN.indexOf(yg)*2+2+(((ZHI.indexOf(mz)-2)%12)+12)%12)%10];
  // 时柱（五鼠遁）
  var hzIdx=Math.floor((hh+1)/2)%12;
  var hz=ZHI[hzIdx];
  var tg=GAN[(GAN.indexOf(dg)*2+hzIdx)%10];
  return {p:[yg+yz, mg+mz, dg+dz, tg+hz], jie:jieName, jieAt:jieAt};
}

// ========== 控件 ==========
function fillSelect(id, items, def){
  var el=document.getElementById(id);
  el.innerHTML='';
  for(var i=0;i<items.length;i++){
    var o=document.createElement('option'); o.value=items[i]; o.text=items[i]; el.appendChild(o);
  }
  if(def!==undefined) el.value=def;
}
function getVal(id){ return document.getElementById(id).value; }
function setVal(id,v){ document.getElementById(id).value=v; }

function rebuildDays(){
  var y=+getVal('gYear'), mo=+getVal('gMonth');
  var maxD=new Date(y,mo,0).getDate();
  var cur=+getVal('gDay')||1;
  var arr=[];
  for(var d=1;d<=maxD;d++){ arr.push(('0'+d).slice(-2)); }
  fillSelect('gDay',arr);
  if(cur>maxD) cur=maxD;
  setVal('gDay',('0'+cur).slice(-2));
}

function initSelects(){
  fillSelect('yGan',GAN,'丙'); fillSelect('yZhi',ZHI,'午');
  fillSelect('mGan',GAN,'丙'); fillSelect('mZhi',ZHI,'申');
  fillSelect('dGan',GAN,'乙'); fillSelect('dZhi',ZHI,'卯');
  fillSelect('tGan',GAN,'乙'); fillSelect('tZhi',ZHI,'酉');
  // 公历控件
  var ySel=document.getElementById('gYear');
  for(var y=1900;y<=2100;y++){ var o=document.createElement('option'); o.value=y; o.text=y; ySel.appendChild(o); }
  var mArr=[]; for(var m=1;m<=12;m++){ mArr.push(('0'+m).slice(-2)); }
  fillSelect('gMonth',mArr,'1');
  var hSel=document.getElementById('gHour');
  for(var h=0;h<24;h++){ var ob=document.createElement('option'); ob.value=('0'+h).slice(-2); ob.text=('0'+h).slice(-2); hSel.appendChild(ob); }
  var minArr=[]; for(var mi=0;mi<60;mi++){ minArr.push(('0'+mi).slice(-2)); }
  fillSelect('gMin',minArr,'00');
  document.getElementById('gMonth').addEventListener('change',rebuildDays);
  document.getElementById('gYear').addEventListener('change',rebuildDays);
  fillNow();
}
function fillNow(){
  var now=new Date();
  setVal('gYear',now.getFullYear());
  setVal('gMonth',('0'+(now.getMonth()+1)).slice(-2));
  rebuildDays();
  setVal('gDay',('0'+now.getDate()).slice(-2));
  setVal('gHour',('0'+now.getHours()).slice(-2));
  setVal('gMin',('0'+now.getMinutes()).slice(-2));
}

// ========== 一、公历换算 → 同步到二 ==========
function convertFromGongli(silent){
  var y=+getVal('gYear'), mo=+getVal('gMonth'), d=+getVal('gDay'), hh=+getVal('gHour'), mm=+getVal('gMin');
  var maxD=new Date(y,mo,0).getDate();
  if(d>maxD){ alert('该月没有'+d+'日'); return; }
  var r=pillarsFromGongli(y,mo,d,hh,mm);
  var p=r.p;
  // 1. 写入四柱
  setVal('yGan',p[0][0]); setVal('yZhi',p[0][1]);
  setVal('mGan',p[1][0]); setVal('mZhi',p[1][1]);
  setVal('dGan',p[2][0]); setVal('dZhi',p[2][1]);
  setVal('tGan',p[3][0]); setVal('tZhi',p[3][1]);
  // 2. 换算结果直接显示在模块一
  var rb=document.getElementById('resultBox');
  rb.classList.remove('empty');
  document.getElementById('resultPillars').textContent=
    p[0]+'年　'+p[1]+'月　'+p[2]+'日　'+p[3]+'时';
  document.getElementById('resultMeta').textContent=
    '公历 '+y+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2)+' '+('0'+hh).slice(-2)+':'+('0'+mm).slice(-2)+
    '　·　月建：'+r.jie+'（'+jdToBJ(r.jieAt)+' 交节）';
  // 3. 高亮闪一下模块二 + 同步徽标
  if(!silent){
    var row=document.getElementById('pillarRow');
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
  }
  document.getElementById('syncBadge').textContent='✓ 已同步到下方四柱：'+p.join(' ');
  document.getElementById('syncBadge').className='badge';
  // 4. 起局
  paipan(!silent);
}
function setShiZhi(zhi){
  var dg=getVal('dGan');
  var hzIdx=ZHI.indexOf(zhi);
  var tg=GAN[(GAN.indexOf(dg)*2+hzIdx)%10];
  setVal('tGan',tg); setVal('tZhi',zhi);
  syncShiBtns();
  paipan(false);
}
function syncShiBtns(){
  var z=getVal('tZhi');
  var bs=document.querySelectorAll('.shi-btn');
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('active', bs[i].getAttribute('data-zhi')===z); }
}
function initShiBtns(){
  var box=document.getElementById('shiBtns');
  ZHI.forEach(function(z){
    var b=document.createElement('button');
    b.className='shi-btn'; b.setAttribute('data-zhi',z); b.textContent=z+'时局';
    b.onclick=function(){ setShiZhi(z); };
    box.appendChild(b);
  });
}

// ========== 排盘核心（算法未改） ==========
function paipan(scroll){
  var yG=getVal('yGan'), yZ=getVal('yZhi');
  var mG=getVal('mGan'), mZ=getVal('mZhi');
  var dG=getVal('dGan'), dZ=getVal('dZhi');
  var tG=getVal('tGan'), tZ=getVal('tZhi');
  if(!yG||!mG||!dG||!tG){ return; }

  var shiZhi=tZ;
  var longGong=zhiGong[shiZhi];
  var longZhi=shiZhi;

  // 十二原神
  var ysByZhi={};
  var start=ZHI.indexOf(shiZhi);
  for(var i=0;i<12;i++){ ysByZhi[ZHI[(start+i)%12]]=YUANSHEN[i]; }

  // 十二建星
  var jianZhi=jianKouJue[longZhi];
  var jxByZhi={};
  var js=ZHI.indexOf(jianZhi);
  for(var i2=0;i2<12;i2++){ jxByZhi[ZHI[(js+i2)%12]]=JIANXING[i2]; }

  // 天干（甲乘龙而飞九宫，中宫合化对按青龙宫固定，余干按洛书序飞布、跳过中宫）
  var ganByGong={};
  ganByGong[longGong]=['甲'];
  var zhongGan=zhongGanForGong(longGong);
  ganByGong[5]=zhongGan.slice();
  var rest=GAN.filter(function(g){ return g!=='甲' && zhongGan.indexOf(g)<0; });
  var luoshu=[1,2,3,4,5,6,7,8,9];
  var idx=luoshu.indexOf(longGong);
  var ri=0;
  for(var k=1;k<=9;k++){
    var num=luoshu[(idx+k)%9];
    if(num===5) continue;
    if(ri<rest.length){ ganByGong[num]=[rest[ri++]]; }
  }

  // 八门
  var menByGong={};
  var huiNum=longGong+1; if(huiNum===5) huiNum++; if(huiNum>9) huiNum-=9;
  var bi=baguaOrder.indexOf(huiNum);
  for(var i3=0;i3<8;i3++){ menByGong[baguaOrder[(bi+i3)%8]]=MEN[i3]; }

  // 组装
  var cells={};
  for(var g=1;g<=9;g++){
    if(g===5){ cells[g]={gan:ganByGong[5]||[], pairs:[], men:null}; continue; }
    var zhis=gongZhi[g];
    var pairs=zhis.map(function(z){ return {zhi:z, ys:ysByZhi[z], jx:jxByZhi[z]}; });
    // 巽艮两宫：两个原神+建星对互换顺序（对照十二局图：巽、艮逆序，坤、乾顺序）
    if(g===4||g===8) pairs=pairs.reverse();
    cells[g]={gan:ganByGong[g]||[], pairs:pairs, men:menByGong[g]};
  }

  render(yG,yZ,mG,mZ,dG,dZ,tG,tZ,shiZhi,longGong,longZhi,jianZhi,zhongGan,cells);
  syncShiBtns();
  if(scroll){
    setTimeout(function(){
      var a=document.getElementById('chartArea');
      if(a && a.scrollIntoView){ a.scrollIntoView({behavior:'smooth', block:'start'}); }
    },60);
  }
}

// ========== 渲染 ==========
function render(yG,yZ,mG,mZ,dG,dZ,tG,tZ,shiZhi,longGong,longZhi,jianZhi,zhongGan,cells){
  var area=document.getElementById('chartArea');
  area.style.display='block';

  var head=document.getElementById('chartHead');
  head.innerHTML =
    '<div class="pillars">'+yG+yZ+'年　'+mG+mZ+'月　'+dG+dZ+'日　'+tG+tZ+'时</div>'+
    '<div class="meta">'+shiZhi+'时局 · 青龙起'+shiZhi+'（'+gongName[longGong]+'宫） · 建星起'+jianZhi+'</div>';

  var grid=document.getElementById('grid');
  grid.innerHTML='';
  for(var r=0;r<3;r++){
    for(var c=0;c<3;c++){
      var g=gridLayout[r][c];
      var cell=document.createElement('div');
      cell.className='cell'+(g===5?' center':'');
      var html='<span class="gong">'+gongName[g]+'</span><span class="txt">';
      var data=cells[g];
      if(g===5){
        html+='<span class="gan">'+(data.gan.join('')||'')+'</span>';
      }else{
        for(var pi=0;pi<data.pairs.length;pi++){
          var p=data.pairs[pi];
          var jxCls=(pi===0?'jx2':'jx');
          html+='<span class="pair"><span class="'+(pi===0?'ys':'ys2')+'">'+p.ys+'</span><span class="'+jxCls+'">'+p.jx+'</span></span>';
        }
        if(data.men) html+='<span class="men">'+data.men+'门</span>';
        if(data.gan.length) html+='<span class="gan">'+data.gan.join('')+'</span>';
      }
      html+='</span>';
      cell.innerHTML=html;
      grid.appendChild(cell);
    }
  }

  var dGanGong=null;
  for(var g2=1;g2<=9;g2++){ if(cells[g2].gan && cells[g2].gan.indexOf(dG)>=0){ dGanGong=g2; break; } }
  document.getElementById('info').innerHTML=
    '四柱：<b>'+yG+yZ+'年 '+mG+mZ+'月 '+dG+dZ+'日 '+tG+tZ+'时</b>；起局为 <b>'+shiZhi+'时局</b>（青龙起'+shiZhi+'，落'+gongName[longGong]+'宫）。'+
    '日干 <b>'+dG+'</b> 落 <b>'+gongName[dGanGong]+'宫</b>（主），日支 <b>'+dZ+'</b> 按地支配宫落 <b>'+gongName[zhiGong[dZ]]+'宫</b>（客）。'+
    '中宫置本局合化对（'+zhongGan.join('')+'，按青龙宫固定）。';

  // 载入此局的预测事项
  var pKey='xqm_predict_'+yG+yZ+mG+mZ+dG+dZ+tG+tZ;
  var pSaved=null;
  try{ pSaved=localStorage.getItem(pKey); }catch(e){}
  document.getElementById('predictText').value=pSaved||'';
  document.getElementById('predictStatus').textContent=pSaved?'此局已保存过预测事项':'';

  document.getElementById('legend').innerHTML=
    '<b>排盘依据（张冠武传·霍斐然整理）：</b>①时上起青龙，十二原神依地支顺时针环布；'+
    '②乘龙见天星，建星按口诀定位后顺时针环布（龙居'+longZhi+'，建星起'+jianZhi+'）；'+
    '③甲乘龙而飞九宫，中宫按青龙宫置固定合化对（坎/乾戊癸，艮/震丙辛，巽/离乙庚，坤/兑丁壬），余干按洛书序飞布；'+
    '④龙头开八门，休门起青龙下一宫，依后天八卦序环布。';
}

// ========== 预测事项 / 历史 ==========
function getHistory(){
  try{ return JSON.parse(localStorage.getItem('xqm_history')||'[]'); }catch(e){ return []; }
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function curKey(){
  return 'xqm_predict_'+getVal('yGan')+getVal('yZhi')+getVal('mGan')+getVal('mZhi')+getVal('dGan')+getVal('dZhi')+getVal('tGan')+getVal('tZhi');
}
function savePredict(){
  var key=curKey();
  var text=document.getElementById('predictText').value;
  try{ localStorage.setItem(key,text); }catch(e){ alert('本机浏览器不允许保存'); return; }
  var now=new Date().toLocaleString('zh-CN');
  var pillars=getVal('yGan')+getVal('yZhi')+'年 '+getVal('mGan')+getVal('mZhi')+'月 '+getVal('dGan')+getVal('dZhi')+'日 '+getVal('tGan')+getVal('tZhi')+'时';
  var hist=getHistory();
  var idx=-1;
  for(var i=0;i<hist.length;i++){ if(hist[i].key===key){ idx=i; break; } }
  if(idx>=0){ hist[idx]={key:key,pillars:pillars,text:text,time:now}; }
  else { hist.unshift({key:key,pillars:pillars,text:text,time:now}); }
  try{ localStorage.setItem('xqm_history',JSON.stringify(hist)); }catch(e){}
  document.getElementById('predictStatus').textContent='已保存（'+now+'）';
  renderHistory();
}
function renderHistory(){
  var hist=getHistory();
  var box=document.getElementById('historyList');
  if(!box) return;
  if(hist.length===0){ box.innerHTML='<div class="hint">暂无记录——保存一次预测事项后，这里会出现历史记录。</div>'; return; }
  box.innerHTML='';
  hist.forEach(function(h){
    var row=document.createElement('div');
    row.className='h-item';
    var body=document.createElement('div');
    body.className='h-body';
    body.innerHTML='<div class="h-pillars">'+esc(h.pillars)+'</div>'+
      '<div class="h-text">'+(esc(h.text)||'（未写事项）')+'</div>'+
      '<div class="h-time">'+esc(h.time)+'</div>';
    body.onclick=function(){ loadHistory(h.key); };
    var del=document.createElement('button');
    del.className='h-del'; del.innerHTML='&times;'; del.title='删除这条记录';
    del.onclick=function(ev){
      ev.stopPropagation();
      if(!confirm('删除这条记录？（只删这条历史，不影响盘）')) return;
      var hs=getHistory().filter(function(x){ return x.key!==h.key; });
      try{ localStorage.setItem('xqm_history',JSON.stringify(hs)); localStorage.removeItem(h.key); }catch(e){}
      renderHistory();
    };
    row.appendChild(body); row.appendChild(del);
    box.appendChild(row);
  });
}
function loadHistory(key){
  var p=key.replace('xqm_predict_','');
  if(p.length<8) return;
  setVal('yGan',p[0]); setVal('yZhi',p[1]);
  setVal('mGan',p[2]); setVal('mZhi',p[3]);
  setVal('dGan',p[4]); setVal('dZhi',p[5]);
  setVal('tGan',p[6]); setVal('tZhi',p[7]);
  document.getElementById('syncBadge').textContent='（本次为历史记录载入，非公历换算）';
  document.getElementById('syncBadge').className='badge warn';
  paipan(true);
}

// ========== 导出 PNG ==========
function savePng(){
  var area=document.getElementById('chartArea');
  var grid=document.getElementById('grid');
  if(!area || area.style.display==='none'){ alert('请先起局再保存'); return; }
  var scale=3;
  var W=680*scale, H=760*scale;
  var cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#fffdf7'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#333';
  ctx.font=Math.round(26*scale)+'px "KaiTi","STKaiti","SimSun"';
  ctx.textAlign='center';
  ctx.fillText('飞 宫 小 奇 门', W/2, 50*scale);
  var head=document.getElementById('chartHead');
  var p=head.querySelector('.pillars')?head.querySelector('.pillars').textContent:'';
  ctx.font=Math.round(20*scale)+'px "KaiTi","SimSun"';
  ctx.fillText(p, W/2, 90*scale);
  var m=head.querySelector('.meta')?head.querySelector('.meta').textContent:'';
  ctx.font=Math.round(15*scale)+'px "KaiTi","SimSun"';
  ctx.fillText(m, W/2, 120*scale);
  var pv=document.getElementById('predictText').value.trim();
  if(pv){
    ctx.fillStyle='#8a2f2f';
    ctx.font=Math.round(15*scale)+'px "KaiTi","SimSun"';
    ctx.fillText('预测事项：'+pv, W/2, 138*scale);
  }
  var oyBase=146*scale + (pv?14*scale:0);

  var cellW=210*scale, cellH=196*scale, gap=4*scale;
  var ox=(W-cellW*3-gap*2)/2, oy=oyBase;
  var pos={4:[0,0],9:[1,0],2:[2,0],3:[0,1],5:[1,1],7:[2,1],8:[0,2],1:[1,2],6:[2,2]};
  for(var i=0;i<9;i++){
    var gNum=gridLayout[Math.floor(i/3)][i%3];
    var xy=pos[gNum];
    var x=ox+xy[0]*(cellW+gap), y=oy+xy[1]*(cellH+gap);
    ctx.strokeStyle='#333'; ctx.lineWidth=2*scale;
    ctx.strokeRect(x,y,cellW,cellH);
    ctx.fillStyle='#8a7a4a';
    ctx.font=Math.round(13*scale)+'px "KaiTi","SimSun"';
    ctx.textAlign='left';
    ctx.fillText(gongName[gNum], x+8*scale, y+20*scale);
    var cellEl=grid.children[i];
    var lines=[];
    var txt=cellEl.querySelector('.txt');
    if(txt){
      var els=txt.querySelectorAll('.ys,.ys2,.jx,.jx2,.men,.gan');
      for(var q=0;q<els.length;q++){
        var el=els[q];
        var c=el.classList.contains('ys')?'#1565c0':el.classList.contains('ys2')?'#2b2b2b':el.classList.contains('jx2')?'#2b2b2b':el.classList.contains('jx')?'#2e9e44':el.classList.contains('men')?'#9c27b0':'#2b2b2b';
        lines.push({t:el.textContent, c:c});
      }
    }
    ctx.textAlign='center';
    ctx.font=Math.round(19*scale)+'px "KaiTi","SimSun"';
    for(var li=0;li<lines.length;li++){
      ctx.fillStyle=lines[li].c;
      ctx.fillText(lines[li].t, x+cellW/2, y+58*scale+li*32*scale);
    }
  }
  var a=document.createElement('a');
  a.download='飞宫小奇门_'+getVal('yGan')+getVal('yZhi')+'_'+getVal('tZhi')+'时.png';
  a.href=cv.toDataURL('image/png');
  a.click();
}

// 四柱手选即时生效：改任意一格立刻重排，日干/时支变动时按五鼠遁自动校正时干
function bindPillarLive(){
  var ids=['yGan','yZhi','mGan','mZhi','dGan','dZhi','tGan','tZhi'];
  ids.forEach(function(id){
    document.getElementById(id).addEventListener('change',function(){
      var badge=document.getElementById('syncBadge');
      if(id==='dGan'||id==='tZhi'){
        var hz=ZHI.indexOf(getVal('tZhi'));
        var ng=GAN[(GAN.indexOf(getVal('dGan'))*2+hz)%10];
        if(getVal('tGan')!==ng){
          setVal('tGan',ng);
          badge.textContent='已按五鼠遁自动重算时干为「'+ng+'」（改日干/时支时连带校正）';
          badge.className='badge warn';
        }
      } else {
        badge.textContent='（四柱为手动改动，非公历换算）';
        badge.className='badge warn';
      }
      paipan(false);
    });
  });
}

initSelects();
initShiBtns();
bindPillarLive();
renderHistory();
convertFromGongli(true);
