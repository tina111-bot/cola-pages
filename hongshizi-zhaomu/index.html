<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>红十字会员·志愿者招募登记 — 衣心衣意·爱在99</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f4f6f8;
    min-height: 100vh;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header {
    background: #c8102e; color: #fff; border-radius: 14px;
    padding: 18px 20px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(200,16,46,.25);
    display: flex; align-items: center; gap: 14px;
  }
  .emblem {
    flex: 0 0 auto; width: 52px; height: 52px; background: #fff;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
  }
  .hd-txt { flex: 1; }
  .brand-logos { display: flex; gap: 8px; flex: 0 0 auto; }
  @media (max-width: 480px) {
    header { padding: 14px 14px; gap: 10px; }
    .brand-logos { gap: 5px; }
    .emblem { width: 38px; height: 38px; border-radius: 8px; }
    header h1 { font-size: 17px; }
    header p { font-size: 12px; margin-top: 4px; }
    .hd-org { font-size: 11px; padding: 1px 8px; }
  }
  .emblem img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
  #lockGate { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  #lockGate input { flex: 0 0 150px; margin: 0; padding: 9px 10px; font-size: 15px; border: 1.5px solid #d9d9d9; border-radius: 9px; outline: none; }
  #lockGate button { margin: 0; padding: 9px 16px; font-size: 14px; font-weight: bold; border-radius: 9px; border: 1.5px solid #c8102e; background: #c8102e; color: #fff; cursor: pointer; flex: 0 0 auto; }
  #lockGate span { font-size: 12px; color: #999; flex: 1 1 100%; }
  #lockBtn { float: right; margin: -2px 0 0 0; padding: 3px 11px; font-size: 12px; font-weight: normal; width: auto; flex: none; background: #fff; color: #c8102e; border: 1px solid #c8102e; border-radius: 20px; cursor: pointer; }

  .hd-org {
    display: inline-block; font-size: 12px; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.45); border-radius: 20px;
    padding: 2px 10px; margin-bottom: 5px; letter-spacing: 1px;
  }
  header h1 { font-size: 20px; line-height: 1.4; }
  header p { font-size: 13px; opacity: .9; margin-top: 6px; }
  .card {
    background: #fff; border-radius: 14px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card h2 {
    font-size: 15px; color: #c8102e; margin-bottom: 14px;
    padding-left: 10px; border-left: 4px solid #c8102e;
  }
  label { display: block; font-size: 14px; color: #333; margin: 12px 0 6px; }
  label .req { color: #c8102e; }
  input[type=text], input[type=tel] {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1.5px solid #d9d9d9; border-radius: 10px; outline: none;
  }
  input:focus { border-color: #c8102e; }
  .seg { display: flex; gap: 10px; }
  .seg button {
    flex: 1; padding: 11px 0; font-size: 15px; border-radius: 10px;
    border: 1.5px solid #d9d9d9; background: #fff; color: #555; cursor: pointer;
  }
  .seg button.on { border-color: #c8102e; background: #fdeef0; color: #c8102e; font-weight: bold; }
  #submitBtn {
    width: 100%; margin-top: 20px; padding: 15px 0;
    font-size: 18px; font-weight: bold; color: #fff;
    background: #c8102e; border: none; border-radius: 12px; cursor: pointer;
  }
  #submitBtn:active { opacity: .85; }
  .stats { display: flex; gap: 10px; text-align: center; }
  .stats .s { flex: 1; background: #faf5f5; border-radius: 10px; padding: 12px 0; }
  .stats .n { font-size: 26px; font-weight: bold; color: #c8102e; }
  .stats .t { font-size: 12px; color: #888; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f0f0f0; padding: 8px 6px; white-space: nowrap; }
  td { padding: 8px 6px; border-bottom: 1px solid #eee; word-break: break-all; }
  .del {
    color: #999; border: none; background: none; font-size: 13px; cursor: pointer;
    text-decoration: underline; padding: 2px 4px;
  }
  .toolbar { display: flex; gap: 10px; margin-top: 14px; }
  .toolbar button {
    flex: 1; padding: 12px 0; font-size: 15px; border-radius: 10px;
    border: 1.5px solid #c8102e; cursor: pointer; font-weight: bold;
  }
  #exportBtn { background: #c8102e; color: #fff; }
  #clearBtn { background: #fff; color: #c8102e; }
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(0,0,0,.78); color: #fff; font-size: 14px;
    padding: 10px 22px; border-radius: 20px; display: none; z-index: 9;
  }
  .hint { font-size: 12px; color: #999; margin-top: 10px; line-height: 1.6; }
</style>
</head>

    <div class="hd-txt">
      <span class="hd-org">濮家社区红十字会</span>
      <h1>红十字会员 · 志愿者招募登记</h1>
      <p>自愿登记 · 信息仅用于入会及志愿者办理</p>
    </div>
  </header>

  <div class="card">
    <div class="stats">
      <div class="s"><div class="n" id="cntAll">0</div><div class="t">登记总数</div></div>
      <div class="s"><div class="n" id="cntMember">0</div><div class="t">意愿会员</div></div>
      <div class="s"><div class="n" id="cntVol">0</div><div class="t">意愿志愿者</div></div>
    </div>
  </div>

  <div class="card">
    <h2>现场登记</h2>
    <label>姓名 <span class="req">*</span></label>
    <input type="text" id="fName" placeholder="请填写姓名" autocomplete="off">

    <label>性别 <span class="req">*</span></label>
    <div class="seg" id="fGender">
      <button data-v="女" type="button">女</button>
      <button data-v="男" type="button">男</button>
    </div>

    <label>联系电话 <span class="req">*</span></label>
    <input type="tel" id="fPhone" maxlength="11" placeholder="11位手机号" autocomplete="off">

    <label>居住地址</label>
    <input type="text" id="fAddr" placeholder="如：濮家新村X幢X单元" autocomplete="off">

    <label>是否愿意加入志愿者队伍 <span class="req">*</span></label>
    <div class="seg" id="fVol">
      <button data-v="愿意" type="button">愿意</button>
      <button data-v="暂不" type="button">暂不</button>
    </div>

    <label>备注</label>
    <input type="text" id="fNote" placeholder="选填" autocomplete="off">

    <button id="submitBtn" type="button">提 交 登 记</button>
    <div class="hint">※ 会费不在现场收取，后续按区红十字会通知另行缴纳。</div>
  </div>

  <div class="card">
    <h2>登记记录<button id="lockBtn" type="button">锁定</button></h2>
    <div id="lockGate">
      <input type="password" id="pwIn" placeholder="工作人员口令" autocomplete="off">
      <button id="pwBtn" type="button">解锁查看</button>
      <span>查看、导出、清空记录需口令；居民登记不受影响。</span>
    </div>
    <div id="recWrap" hidden>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>#</th><th>姓名</th><th>性别</th><th>电话</th><th>志愿者</th><th>时间</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="7" style="text-align:center;color:#bbb;padding:20px">暂无记录</td></tr></tbody>
      </table>
    </div>
    <div class="toolbar">
      <button id="exportBtn" type="button">导出 Excel（CSV）</button>
      <button id="clearBtn" type="button">清空记录</button>
    </div>
    </div>
    <div class="hint">※ 数据保存在本机浏览器中，关闭页面不丢失；换设备请先导出。登记表所涉个人信息由专人保管，仅用于会员及志愿者办理。</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var KEY = 'pjhs_recruit_2026';
var records = [];
try { records = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { records = []; }

var selGender = '', selVol = '';
function bindSeg(id, cb) {
  var box = document.getElementById(id);
  box.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var kids = box.querySelectorAll('button');
    for (var i = 0; i < kids.length; i++) kids[i].classList.remove('on');
    b.classList.add('on'); cb(b.getAttribute('data-v'));
  });
}
bindSeg('fGender', function (v) { selGender = v; });
bindSeg('fVol', function (v) { selVol = v; });

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.style.display = 'none'; }, 2200);
}

function save() { localStorage.setItem(KEY, JSON.stringify(records)); }

function fmt(ts) {
  var d = new Date(ts), p = function (x) { return (x < 10 ? '0' : '') + x; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function render() {
  var tb = document.getElementById('tbody');
  if (!records.length) {
    tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#bbb;padding:20px">暂无记录</td></tr>';
  } else {
    var html = '';
    for (var i = records.length - 1; i >= 0; i--) {
      var r = records[i];
      html += '<tr><td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.gender) +
        '</td><td>' + esc(r.phone) + '</td><td>' + esc(r.vol) +
        '</td><td>' + fmt(r.ts) + '</td><td><button class="del" data-i="' + i + '">删</button></td></tr>';
    }
    tb.innerHTML = html;
  }
  var vol = 0;
  for (var j = 0; j < records.length; j++) if (records[j].vol === '愿意') vol++;
  document.getElementById('cntAll').textContent = records.length;
  document.getElementById('cntVol').textContent = vol;
  document.getElementById('cntMember').textContent = records.length;
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

document.getElementById('tbody').addEventListener('click', function (ev) {
  var b = ev.target.closest('.del'); if (!b) return;
  var i = parseInt(b.getAttribute('data-i'), 10);
  var r = records[i];
  if (confirm('确认删除登记记录：' + r.name + '（' + fmt(r.ts) + '）？\n删除后如需保留，请先导出Excel。')) {
    records.splice(i, 1); save(); render(); toast('已删除');
  }
});

document.getElementById('submitBtn').addEventListener('click', function () {
  var name = document.getElementById('fName').value.trim();
  var phone = document.getElementById('fPhone').value.trim();
  if (!name) { toast('请填写姓名'); return; }
  if (!selGender) { toast('请选择性别'); return; }
  if (!/^1\d{10}$/.test(phone)) { toast('请填写11位手机号'); return; }
  if (!selVol) { toast('请选择是否愿意加入志愿者'); return; }
  records.push({
    name: name, gender: selGender, phone: phone,
    addr: document.getElementById('fAddr').value.trim(),
    vol: selVol, note: document.getElementById('fNote').value.trim(),
    ts: Date.now()
  });
  save(); render(); toast('登记成功 ✔');
  document.getElementById('fName').value = '';
  document.getElementById('fPhone').value = '';
  document.getElementById('fAddr').value = '';
  document.getElementById('fNote').value = '';
  selGender = ''; selVol = '';
  var kids = document.querySelectorAll('.seg button');
  for (var i = 0; i < kids.length; i++) kids[i].classList.remove('on');
  document.getElementById('fName').focus();
});

document.getElementById('exportBtn').addEventListener('click', function () {
  if (!records.length) { toast('暂无记录可导出'); return; }
  var head = ['序号', '姓名', '性别', '联系电话', '居住地址', '愿意加入志愿者', '备注', '登记时间', '会员登记意愿', '是否已缴费'];
  var lines = [head.join(',')];
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    lines.push([i + 1, q(r.name), q(r.gender), q(r.phone), q(r.addr), q(r.vol), q(r.note), fmt(r.ts), q('是'), q('否（另行通知缴纳）')].join(','));
  }
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
  a.download = '濮家社区红十字会员招募登记' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('已导出，可用WPS/Excel直接打开');
});

document.getElementById('clearBtn').addEventListener('click', function () {
  if (!records.length) { toast('暂无记录'); return; }
  if (confirm('确认清空全部 ' + records.length + ' 条记录？\n清空前请先导出Excel留档！')) {
    records = []; save(); render(); toast('已清空');
  }
});

function q(s) {
  s = String(s == null ? '' : s);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}


var PASSCODE = 'pjhs99';
function _unlocked() { return sessionStorage.getItem('pjhs_unlock') === '1'; }
function _applyLock() {
  var g = document.getElementById('lockGate'), w = document.getElementById('recWrap'), b = document.getElementById('lockBtn');
  if (_unlocked()) { g.style.display = 'none'; w.hidden = false; b.style.display = ''; }
  else { g.style.display = ''; w.hidden = true; b.style.display = 'none'; }
}
document.getElementById('pwBtn').addEventListener('click', function () {
  var v = document.getElementById('pwIn').value.trim();
  if (v === PASSCODE) { sessionStorage.setItem('pjhs_unlock', '1'); _applyLock(); toast('已解锁'); }
  else { toast('口令不对'); document.getElementById('pwIn').value = ''; }
});
document.getElementById('pwIn').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('pwBtn').click();
});
document.getElementById('lockBtn').addEventListener('click', function () {
  sessionStorage.removeItem('pjhs_unlock'); _applyLock(); toast('已锁定');
});
_applyLock();
render();
</script>
</body>
</html>
