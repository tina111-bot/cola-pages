<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>单词小星球 · 小学英语训练</title>
<style>
:root{--bg:#fff8ed;--card:#fff;--ink:#30333a;--sub:#7d8088;--main:#ff8a3d;--main2:#f16b32;--soft:#fff0df;--green:#31b675;--greenSoft:#e5f8ee;--red:#e85858;--redSoft:#fff0f0;--blue:#5b8def;--line:#f0e5d8;--shadow:0 4px 18px rgba(116,73,28,.09);--radius:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;margin:0}body{max-width:540px;margin:auto;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.55;padding-bottom:78px}button,input,select{font:inherit}button{cursor:pointer;border:0}header{position:sticky;top:0;z-index:5;background:rgba(255,250,243,.94);backdrop-filter:blur(10px);padding:15px 18px 11px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between}header h1{font-size:20px;margin:0;font-weight:850}header h1 em{font-style:normal;color:var(--main2)}#header-sub{font-size:12px;color:var(--sub)}main{padding:16px}.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.card h2{font-size:16px;margin:0 0 10px}.muted{font-size:13px;color:var(--sub)}.center{text-align:center}.row{display:flex;align-items:center;gap:10px}.btn{width:100%;padding:14px 16px;border-radius:15px;font-weight:800;font-size:16px;transition:transform .06s}.btn:active,.opt:active{transform:scale(.98)}.btn-main{background:var(--main);color:#fff}.btn-soft{background:var(--soft);color:var(--main2)}.btn-ghost{background:#f5f3f0;color:var(--ink)}.btn-green{background:var(--green);color:#fff}.btn-row{display:flex;gap:10px}.btn-row .btn{flex:1}.hidden{display:none!important}.fade{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#fff0d7,#fffaf3);overflow:hidden;position:relative}.hero:after{content:'⭐';position:absolute;right:18px;top:11px;font-size:42px;opacity:.8}.hero-title{font-size:21px;font-weight:850;margin-bottom:3px}.hero-sub{color:var(--sub);font-size:13px;max-width:82%}.ringrow{display:flex;align-items:center;gap:15px}.ring{width:76px;height:76px;flex:none;border-radius:50%;background:conic-gradient(var(--main) calc(var(--p,0)*1%),#f3e8da 0);display:flex;align-items:center;justify-content:center;position:relative}.ring:before{content:'';position:absolute;inset:8px;border-radius:50%;background:#fff}.ring b{position:relative;font-size:18px}.prog{flex:1}.bar{height:10px;background:#f1e9df;border-radius:8px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:0;background:var(--main);border-radius:8px;transition:width .3s}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats .n{font-size:20px;font-weight:850;color:var(--main2)}.stats .l{font-size:11px;color:var(--sub)}
.emoji{font-size:50px;margin:6px 0}.flipwrap{perspective:1000px;margin-bottom:14px}.flip{height:300px;position:relative;transform-style:preserve-3d;transition:transform .35s;cursor:pointer}.flip.on{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}.face.back{transform:rotateY(180deg);background:linear-gradient(145deg,#fff2df,#fffaf3)}.word{font-size:36px;font-weight:850;letter-spacing:.4px}.phon{font-family:Georgia,serif;color:var(--sub);font-size:15px;margin-top:4px}.def{font-size:21px;font-weight:750;margin-top:8px}.pos{font-size:12px;color:var(--main2);background:#fff;padding:3px 10px;border-radius:20px;margin-top:9px}.speak{width:46px;height:46px;border-radius:50%;background:var(--soft);color:var(--main2);font-size:21px;margin-top:14px}.hint{font-size:12px;color:var(--sub);margin-top:13px}.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.qword{font-size:32px;font-weight:850;text-align:center;margin:10px 0 2px}.qdef{text-align:center;font-size:21px;font-weight:750;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;background:#fffaf5;border:1.5px solid #f0dfce;border-radius:15px;padding:14px;margin:10px 0;font-size:16px}.opt.right{border-color:var(--green);background:var(--greenSoft);font-weight:800}.opt.wrong{border-color:var(--red);background:var(--redSoft)}.opt.off{opacity:.55}.spell{width:100%;padding:14px;border:1.5px solid #e3d7c8;border-radius:15px;text-align:center;font-size:20px;outline:0;background:#fffdfb}.spell:focus{border-color:var(--main)}.fb{font-weight:750;margin-top:13px}.fb.ok{color:var(--green)}.fb.no{color:var(--red)}.wrongitem{display:flex;align-items:center;gap:9px;padding:12px 2px;border-bottom:1px solid var(--line)}.wrongitem:last-child{border-bottom:0}.ww{font-weight:800;font-size:17px}.wd{flex:1;font-size:13px;color:var(--sub)}.badge{font-size:11px;color:var(--red);background:var(--redSoft);padding:2px 8px;border-radius:20px;white-space:nowrap}select{border:1px solid #e3d7c8;border-radius:10px;padding:6px 8px;background:#fffaf5;color:var(--ink)}nav{position:fixed;z-index:8;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;color:var(--sub);font-size:11px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}nav button .ic{font-size:21px;line-height:1}nav button.on{color:var(--main2);font-weight:800}.dot{position:absolute;margin-left:17px;margin-top:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;min-width:16px;padding:0 4px}.tag{display:inline-block;font-size:11px;color:var(--main2);background:var(--soft);border-radius:20px;padding:2px 9px;margin:2px}
</style>
</head>
<body>
<header><h1>单词<em>小星球</em></h1><div id="header-sub">小学核心词汇</div></header>
<main>
<section id="page-home" class="page">
  <div class="card hero"><div class="hero-title">今天也来收集单词星星吧 ✨</div><div class="hero-sub">杭州小学三至六年级 · 人教版 PEP · 每天少量、反复练习</div></div>
  <div class="card ringrow"><div class="ring" id="ring"><b id="ring-pct">0%</b></div><div class="prog"><div id="today-date" class="muted"></div><div id="today-title" style="font-weight:800">今天还没开始</div><div class="bar"><i id="today-bar"></i></div></div></div>
  <div class="card" id="home-actions"></div>
  <div class="card"><h2>📊 我的学习记录</h2><div class="stats"><div><div class="n" id="st-total">–</div><div class="l">总词数</div></div><div><div class="n" id="st-learned">–</div><div class="l">已学</div></div><div><div class="n" id="st-known">–</div><div class="l">认识</div></div><div><div class="n" id="st-wrong">–</div><div class="l">待复习</div></div></div><div style="height:10px"></div><div class="stats"><div><div class="n" id="st-streak">–</div><div class="l">连续学习</div></div><div><div class="n" id="st-today">–</div><div class="l">今日新词</div></div><div><div class="n" id="st-days">–</div><div class="l">学习天数</div></div><div><div class="n" id="st-rate">–</div><div class="l">认识率</div></div></div></div>
</section>
<section id="page-learn" class="page hidden"><div class="card" style="padding:9px 18px"><div class="row" style="justify-content:space-between"><span class="muted">认识新词</span><span class="muted" id="learn-progress"></span></div><div class="bar"><i id="learn-bar"></i></div></div><div class="flipwrap"><div class="flip" id="flip"><div class="face"><div class="word" id="l-word"></div><button class="speak" id="l-speak">🔊</button><div class="hint">点卡片看中文 · 点喇叭听发音</div></div><div class="face back"><div class="word" id="l-word2" style="font-size:29px"></div><div class="phon" id="l-phon"></div><div class="def" id="l-def"></div><div class="pos" id="l-pos"></div><button class="speak" id="l-speak2">🔊</button></div></div></div><div class="btn-row"><button class="btn btn-ghost" id="l-hard">还不熟</button><button class="btn btn-main" id="l-easy">记住了 ✓</button></div></section>
<section id="page-test" class="page hidden"><div class="card" style="padding:9px 18px"><div class="row" style="justify-content:space-between"><span class="muted" id="test-mode">小测验</span><span class="muted" id="test-progress"></span></div><div class="bar"><i id="test-bar"></i></div></div><div class="card" id="test-card"></div></section>
<section id="page-wrong" class="page hidden"><div class="card"><h2>🧩 待复习的词</h2><div class="muted" id="wrong-summary">还没有错词，继续保持！</div><div style="height:10px"></div><button class="btn btn-main" id="wrong-review">开始复习</button></div><div class="card" id="wrong-list"></div></section>
<section id="page-stats" class="page hidden"><div class="card"><h2>🌟 学习设置</h2><div class="row" style="justify-content:space-between;margin:12px 0"><span>学习年级</span><select id="set-grade"><option value="all">三至六年级</option><option value="3">三年级</option><option value="4">四年级</option><option value="5">五年级</option><option value="6">六年级</option></select></div><div class="row" style="justify-content:space-between;margin:12px 0"><span>每天新词</span><select id="set-perday"><option value="5">5 个</option><option value="10">10 个</option><option value="15">15 个</option><option value="20">20 个</option></select></div><div class="row" style="justify-content:space-between;margin:12px 0"><span>练习方式</span><select id="set-mode"><option value="choice">选择题（推荐）</option><option value="interfill">中英互填</option></select></div><div class="muted" style="margin:12px 0">建议小学阶段每天 5–10 个，先把正确率和坚持做起来。</div><button class="btn btn-ghost" id="btn-reset">清空本机学习记录</button></div><div class="card"><h2>📈 总进度</h2><div class="row" style="justify-content:space-between"><span class="muted">已学词数</span><span class="muted" id="pg-total"></span></div><div class="bar"><i id="pg-bar"></i></div><div style="height:12px"></div><div class="stats"><div><div class="n" id="pg-known">–</div><div class="l">认识</div></div><div><div class="n" id="pg-wrong">–</div><div class="l">待复习</div></div><div><div class="n" id="pg-rate">–</div><div class="l">认识率</div></div></div></div></section>
</main>
<nav><button data-page="home" class="on"><span class="ic">🏠</span>今日</button><button data-page="wrong"><span class="ic">🧩</span>复习<span class="dot hidden" id="wrong-dot">0</span></button><button data-page="stats"><span class="ic">⚙️</span>设置</button></nav>
<script src="wordlist-inline.js"></script>
<script>
'use strict';
let WORDS=[],ACTIVE_WORDS=[];const KEY='primary_vocab_pep_v1';let S=null,curPage='home',flow=null,reviewQ=[],reviewIdx=0;
const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const fmt=()=>{const d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+'日一二三四五六'[d.getDay()]};
function defaultState(){return {learned:[],known:{},wrong:{},daily:{},settings:{grade:'all',perDay:10,mode:'choice'}}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch(e){S=defaultState()}S.learned=Array.isArray(S.learned)?S.learned:[];S.known=S.known||{};S.wrong=S.wrong||{};S.daily=S.daily||{};S.settings=S.settings||{grade:'all',perDay:10,mode:'choice'};if(!S.settings.grade)S.settings.grade='all';if(!S.settings.perDay)S.settings.perDay=10;if(!S.settings.mode)S.settings.mode='choice'}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function bind(id,fn){const el=$(id);if(el)el.onclick=fn}function addWrong(w){if(!S.wrong[w])S.wrong[w]={n:0,last:0};S.wrong[w].n++;S.wrong[w].last=Date.now();save();updateDot()}function markKnown(w){S.known[w]=1;save()}
function applyGrade(){const g=S.settings.grade||'all',seen=new Set();ACTIVE_WORDS=[];WORDS.forEach(w=>{const key=w.word.toLowerCase();if((g==='all'||String(w.grade)===g)&&!seen.has(key)){seen.add(key);ACTIVE_WORDS.push(w)}});$('header-sub').textContent=(g==='all'?'PEP三至六年级':'PEP'+g+'年级')+' · '+ACTIVE_WORDS.length+' 词'}
function todayWords(){return ACTIVE_WORDS.filter(w=>!S.learned.includes(w.word)).slice(0,S.settings.perDay)}
function streak(){let n=0,d=new Date();for(let i=0;i<400;i++){const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(S.daily[k]&&S.daily[k].done)n++;else if(i)break;d.setDate(d.getDate()-1)}return n}
function go(p){curPage=p;document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$('page-'+p).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.page===p));if(p==='home')renderHome();if(p==='wrong')renderWrong();if(p==='stats')renderStats()}
function renderHome(){const ws=todayWords(),t=S.daily[today()],done=t&&t.done;let pct=done?100:0,title=done?'✅ 今天完成啦！':(ws.length?'今天有 '+ws.length+' 个新词':'🎉 词库学完啦！');if(flow){pct=flow.step==='learn'?Math.round(flow.i/Math.max(flow.words.length,1)*100):Math.round((flow.i/Math.max(flow.q.length,1))*100);title=flow.step==='learn'?'正在认识新词':'正在小测验'}$('today-date').textContent=fmt();$('today-title').textContent=title;$('ring').style.setProperty('--p',pct);$('ring-pct').textContent=pct+'%';$('today-bar').style.width=pct+'%';$('home-actions').innerHTML='';const b=document.createElement('button');b.className='btn '+(done?'btn-soft':'btn-main');b.textContent=done?'再练一组':'开始今天任务';b.onclick=()=>{if(done){S.daily[today()].done=false;save()}startFlow()};$('home-actions').appendChild(b);$('st-total').textContent=ACTIVE_WORDS.length;$('st-learned').textContent=S.learned.length;$('st-known').textContent=Object.keys(S.known).length;$('st-wrong').textContent=Object.keys(S.wrong).length;$('st-streak').textContent=streak();$('st-today').textContent=t?t.newWords||0:0;$('st-days').textContent=Object.keys(S.daily).length;$('st-rate').textContent=(S.learned.length?Math.round(Object.keys(S.known).length/S.learned.length*100):0)+'%'}
function startFlow(){const words=todayWords();if(!words.length){alert('太棒了，词库已经学完！可以去复习错词。');return}flow={step:'learn',i:0,words:words,q:[],correct:0};go('learn');openLearn()}
function openLearn(){if(flow.i>=flow.words.length){flow.step='test';flow.i=0;flow.q=buildQuiz(flow.words);go('test');openTest();return}const w=flow.words[flow.i];$('l-word').textContent=w.word;$('l-word2').textContent=w.word;$('l-phon').textContent=w.phonetic||'';$('l-def').textContent=w.def;$('l-pos').textContent=w.pos||'';$('learn-progress').textContent=(flow.i+1)+' / '+flow.words.length;$('learn-bar').style.width=Math.round((flow.i+1)/flow.words.length*100)+'%';$('flip').classList.remove('on');speak(w.word)}
function buildQuiz(words){const q=[];for(const w of words){if(S.settings.mode==='interfill'){q.push({type:'en2cn',w});q.push({type:'cn2en',w})}else q.push({type:Math.random()<.5?'en2zh':'zh2en',w})}return shuffle(q)}
function norm(s){return(s||'').toLowerCase().replace(/[\s，,、；;（）()·。."':：!?！？]/g,'')}function cnMatch(a,b){a=norm(a);if(!a)return false;return norm(b).split(/[;；]/).some(x=>x&&(a===x||(a.length>=2&&(a.includes(x)||x.includes(a)))))}
function pick(q){const answer=q.type==='en2zh'?q.w.def:q.w.word,set=new Set([answer]);let guard=0;while(set.size<4&&guard++<100){const x=ACTIVE_WORDS[Math.floor(Math.random()*ACTIVE_WORDS.length)];set.add(q.type==='en2zh'?x.def:x.word)}return shuffle([...set])}
function openTest(){if(flow.i>=flow.q.length){finish();return}const q=flow.q[flow.i];$('test-progress').textContent=(flow.i+1)+' / '+flow.q.length;$('test-bar').style.width=Math.round((flow.i+1)/flow.q.length*100)+'%';$('test-mode').textContent=q.type==='cn2en'?'看中文拼英文':q.type==='en2cn'?'看英文写中文':'选择题';const card=$('test-card');card.innerHTML='';if(q.type==='cn2en'){questionInput(card,'看中文，拼出英文单词',q.w.def,'输入英文单词',v=>v.toLowerCase()===q.w.word.toLowerCase(),q,v=>q.w.word+'  '+q.w.def)}else if(q.type==='en2cn'){questionInput(card,'看英文，写出中文意思',q.w.word,'输入中文意思',v=>cnMatch(v,q.w.def),q,v=>q.w.def,true)}else{const dir=q.type==='en2zh';const head=document.createElement('div');head.className='qhead';head.innerHTML='<span class="muted">'+(dir?'选中文意思':'选对应单词')+'</span>';card.appendChild(head);const center=document.createElement('div');center.className='center';const main=document.createElement('div');main.className=dir?'qword':'qdef';main.textContent=dir?q.w.word:q.w.def;center.appendChild(main);if(dir){const sp=document.createElement('button');sp.className='speak';sp.textContent='🔊';sp.onclick=()=>speak(q.w.word);center.appendChild(sp)}card.appendChild(center);pick(q).forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{const ok=v===(dir?q.w.def:q.w.word);card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('off');if(x.textContent===(dir?q.w.def:q.w.word))x.classList.add('right')});if(!ok)b.classList.add('wrong');answer(ok,q,v)};card.appendChild(b)})}}
function questionInput(card,label,prompt,placeholder,check,q,right,cn){const h=document.createElement('div');h.className='qhead';h.innerHTML='<span class="muted">'+label+'</span>';card.appendChild(h);const c=document.createElement('div');c.className='center';const m=document.createElement('div');m.className=cn?'qword':'qdef';m.textContent=prompt;c.appendChild(m);if(cn){const sp=document.createElement('button');sp.className='speak';sp.textContent='🔊';sp.onclick=()=>speak(q.w.word);c.appendChild(sp)}card.appendChild(c);const input=document.createElement('input');input.className='spell';input.placeholder=placeholder;input.autocomplete='off';input.autocapitalize='off';input.spellcheck=false;card.appendChild(input);const gap=document.createElement('div');gap.style.height='12px';card.appendChild(gap);const b=document.createElement('button');b.className='btn btn-main';b.textContent='确定';b.onclick=()=>{const v=input.value.trim();if(!v)return;answer(check(v),q,v)};card.appendChild(b);input.onkeydown=e=>{if(e.key==='Enter')b.click()};setTimeout(()=>input.focus(),30)}
function answer(ok,q,input){if(ok){flow.correct++;markKnown(q.w.word);showFeedback(true,q)}else{addWrong(q.w.word);showFeedback(false,q,input)}setTimeout(()=>{flow.i++;openTest()},ok?650:1500)}function showFeedback(ok,q,input){const f=document.createElement('div');f.className='fb '+(ok?'ok':'no');f.textContent=ok?'✓ 答对啦！':'✗ 正确答案：'+q.w.word+'  '+q.w.def+(input?'（你写了：'+input+'）':'');$('test-card').appendChild(f)}
function finish(){const t=today();S.daily[t]=S.daily[t]||{};S.daily[t].done=true;S.daily[t].newWords=flow.words.length;flow.words.forEach(w=>{if(!S.learned.includes(w.word))S.learned.push(w.word)});save();flow=null;go('home')}
function updateDot(){const n=Object.keys(S.wrong).length;$('wrong-dot').textContent=n;$('wrong-dot').classList.toggle('hidden',!n)}
function renderWrong(){const ws=Object.keys(S.wrong).sort((a,b)=>S.wrong[b].n-S.wrong[a].n);updateDot();$('wrong-summary').textContent=ws.length?'有 '+ws.length+' 个词需要再见几次':'还没有错词，继续保持！';$('wrong-review').style.display=ws.length?'block':'none';$('wrong-list').innerHTML='<h2>📋 词语清单</h2>';if(!ws.length){$('wrong-list').insertAdjacentHTML('beforeend','<div class="center muted">答错的词会出现在这里</div>');return}ws.forEach(word=>{const info=ACTIVE_WORDS.find(x=>x.word===word)||WORDS.find(x=>x.word===word)||{def:''};const row=document.createElement('div');row.className='wrongitem';row.innerHTML='<div><div class="ww"></div><div class="muted">错了 '+S.wrong[word].n+' 次</div></div><div class="wd"></div>';row.querySelector('.ww').textContent=word;row.querySelector('.wd').textContent=info.def;const sp=document.createElement('button');sp.className='speak';sp.style.cssText='width:36px;height:36px;font-size:16px;margin:0';sp.textContent='🔊';sp.onclick=()=>speak(word);row.appendChild(sp);$('wrong-list').appendChild(row)});$('wrong-review').onclick=()=>startReview(ws)}
function startReview(words){reviewQ=shuffle(words.map(w=>({type:'en2zh',w:ACTIVE_WORDS.find(x=>x.word===w)||WORDS.find(x=>x.word===w)})));reviewIdx=0;go('test');openReview()}
function openReview(){if(reviewIdx>=reviewQ.length){go('wrong');return}const q=reviewQ[reviewIdx];$('test-progress').textContent=(reviewIdx+1)+' / '+reviewQ.length;$('test-bar').style.width=Math.round((reviewIdx+1)/reviewQ.length*100)+'%';$('test-mode').textContent='错词复习';const card=$('test-card');card.innerHTML='';const c=document.createElement('div');c.className='center';const m=document.createElement('div');m.className='qword';m.textContent=q.w.word;c.appendChild(m);const sp=document.createElement('button');sp.className='speak';sp.textContent='🔊';sp.onclick=()=>speak(q.w.word);c.appendChild(sp);card.appendChild(c);pick(q).forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{const ok=v===q.w.def;card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;x.classList.add('off');if(x.textContent===q.w.def)x.classList.add('right')});if(!ok)b.classList.add('wrong');if(ok){delete S.wrong[q.w.word];markKnown(q.w.word)}else addWrong(q.w.word);setTimeout(()=>{reviewIdx++;openReview()},800)};card.appendChild(b)})}
function renderStats(){const known=Object.keys(S.known).length,wrong=Object.keys(S.wrong).length,rate=S.learned.length?Math.round(known/S.learned.length*100):0;$('set-grade').value=S.settings.grade||'all';$('set-perday').value=S.settings.perDay;$('set-mode').value=S.settings.mode;$('pg-total').textContent=S.learned.length+' / '+ACTIVE_WORDS.length;$('pg-bar').style.width=Math.round(S.learned.length/Math.max(ACTIVE_WORDS.length,1)*100)+'%';$('pg-known').textContent=known;$('pg-wrong').textContent=wrong;$('pg-rate').textContent=rate+'%'}
$('flip').onclick=()=>$('flip').classList.toggle('on');$('l-speak').onclick=e=>{e.stopPropagation();speak(flow.words[flow.i].word)};$('l-speak2').onclick=e=>{e.stopPropagation();speak(flow.words[flow.i].word)};$('l-hard').onclick=()=>{addWrong(flow.words[flow.i].word);flow.i++;openLearn()};$('l-easy').onclick=()=>{markKnown(flow.words[flow.i].word);flow.i++;openLearn()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('set-grade').onchange=e=>{S.settings.grade=e.target.value;save();applyGrade();renderHome()};$('set-perday').onchange=e=>{S.settings.perDay=+e.target.value;save();renderHome()};$('set-mode').onchange=e=>{S.settings.mode=e.target.value;save()};$('btn-reset').onclick=()=>{if(confirm('确定清空这台设备上的学习记录吗？')){localStorage.removeItem(KEY);location.reload()}};
fetch('wordlist.json').then(r=>r.json()).then(a=>{WORDS=a;load();applyGrade();go('home')}).catch(()=>{if(window.PRIMARY_WORDS&&window.PRIMARY_WORDS.length){WORDS=window.PRIMARY_WORDS;load();applyGrade();go('home')}else{document.body.insertAdjacentHTML('beforeend','<div style="padding:30px;text-align:center">词库加载失败，请确认词库文件在同一目录。</div>')}});
</script>
